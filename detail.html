<!DOCTYPE html>
<html lang="uk">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="О.Депозит">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>О.Депозит — деталі</title>
<style>
  :root{
    --bg:#F1F0F6;
    --sheet:#FFFFFF;
    --text:#111114;
    --muted:#9A9AA2;
    --magenta:#C1178E;
    --ring-bg:#F3E3EC;
    --divider:#EFEFF2;
    --switch:#34C759;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  .screen{
    position:relative;
    width:100%;
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* ---------- NAV ---------- */
  .nav{
    display:flex;
    align-items:center;
    gap:18px;
    height:48px;
    padding:calc(6px + env(safe-area-inset-top)) 20px 0;
  }
  .nav .back{
    width:26px; height:26px;
    flex:0 0 auto;
    display:flex; align-items:center;
    cursor:pointer;
  }
  .nav .back svg{ width:24px; height:24px; stroke:#111; fill:none; }
  .nav .title{
    font-size:21px;
    font-weight:600;
    letter-spacing:-.2px;
  }

  /* ---------- AMOUNT ---------- */
  .amount{
    margin-top:18px;
    text-align:center;
    font-size:37px;
    font-weight:700;
    letter-spacing:-.5px;
    color:var(--magenta);
    line-height:1;
  }

  /* ---------- DONUT ---------- */
  .donut{
    position:relative;
    width:236px;
    height:236px;
    margin:26px auto 6px;
  }
  .donut svg{ width:100%; height:100%; display:block; }
  .donut-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .donut-center .rate{
    font-size:30px;
    font-weight:700;
    letter-spacing:-.3px;
    color:var(--text);
  }
  .donut-center .rate-lbl{
    font-size:17px;
    color:var(--muted);
    font-weight:400;
  }

  /* ---------- ACTION BUTTONS ---------- */
  .actions{
    display:flex;
    justify-content:space-between;
    padding:22px 30px 30px;
  }
  .action{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    width:33%;
    cursor:pointer;
  }
  .action .circle{
    width:72px; height:72px;
    border-radius:50%;
    background:var(--magenta);
    display:flex; align-items:center; justify-content:center;
  }
  .action .circle svg{ width:30px; height:30px; stroke:#fff; fill:none; stroke-width:2; }
  .action .cap{
    font-size:16px;
    text-align:center;
    line-height:1.2;
    color:var(--text);
    font-weight:400;
  }

  /* ---------- WHITE CARD ---------- */
  .card{
    flex:1 0 auto;
    background:var(--sheet);
    border-top-left-radius:18px;
    border-top-right-radius:18px;
    padding:6px 20px calc(env(safe-area-inset-bottom) + 20px);
  }

  .drow{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .dicon{
    width:44px; height:44px;
    flex:0 0 auto;
    border-radius:50%;
    background:var(--magenta);
    display:flex; align-items:center; justify-content:center;
  }
  .dicon svg{ width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; }
  .dicon .pct{ color:#fff; font-size:19px; font-weight:700; }

  .dbody{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 0;
    border-bottom:1px solid var(--divider);
    min-height:44px;
  }
  .drow:last-child .dbody{ border-bottom:none; }

  .dtitle{
    font-size:17px;
    font-weight:600;
    letter-spacing:-.2px;
    line-height:1.25;
  }
  .dsub{
    font-size:15px;
    color:var(--muted);
    margin-top:4px;
    font-weight:400;
  }

  /* ---------- TOGGLE ---------- */
  .toggle{
    flex:0 0 auto;
    width:52px; height:32px;
    border-radius:16px;
    background:var(--switch);
    position:relative;
    cursor:pointer;
  }
  .toggle::after{
    content:"";
    position:absolute;
    top:2px; left:22px;
    width:28px; height:28px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    transition:left .2s ease;
  }
  .toggle.off{ background:#E4E4EA; }
  .toggle.off::after{ left:2px; }
</style>
</head>

<body>
  <div class="screen">

    <!-- NAV -->
    <div class="nav">
      <div class="back" onclick="history.back()">
        <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </div>
      <div class="title">О.Депозит онлайн (% щомісячно)</div>
    </div>

    <!-- AMOUNT -->
    <div class="amount">400 000.00 ₴</div>

    <!-- DONUT -->
    <div class="donut">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="80" fill="none" stroke="var(--ring-bg)" stroke-width="24"/>
        <circle cx="100" cy="100" r="80" fill="none" stroke="var(--magenta)" stroke-width="24"
                stroke-dasharray="502.65" stroke-dashoffset="150.8"
                transform="rotate(-90 100 100)"/>
      </svg>
      <div class="donut-center">
        <div class="rate">16.75 %</div>
        <div class="rate-lbl">Ставка</div>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="actions">
      <div class="action">
        <div class="circle">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="3" width="14" height="18" rx="2"/>
            <path d="M9 8h6M9 12h6M9 16h4"/>
          </svg>
        </div>
        <div class="cap">Виписка</div>
      </div>

      <div class="action">
        <div class="circle">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
            <path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>
          </svg>
        </div>
        <div class="cap">Умови<br>депозиту</div>
      </div>

      <div class="action">
        <div class="circle">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 20V4"/><path d="M5 20h16"/>
            <rect x="8" y="12" width="3" height="5"/>
            <rect x="13" y="8" width="3" height="9"/>
            <rect x="18" y="5" width="3" height="12"/>
          </svg>
        </div>
        <div class="cap">Графік<br>виплати %</div>
      </div>
    </div>

    <!-- WHITE CARD -->
    <div class="card">

      <div class="drow">
        <div class="dicon"><span class="pct">%</span></div>
        <div class="dbody">
          <div class="dtext">
            <div class="dtitle">Рахунок для виплати депозиту та %</div>
            <div class="dsub">О.Картка+</div>
          </div>
        </div>
      </div>

      <div class="drow">
        <div class="dicon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
            <path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>
          </svg>
        </div>
        <div class="dbody">
          <div class="dtext"><div class="dtitle">Договір</div></div>
        </div>
      </div>

      <div class="drow">
        <div class="dicon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4.5l5 5"/><path d="M4 20l1-4L16 5l3 3L8 19z"/>
          </svg>
        </div>
        <div class="dbody">
          <div class="dtext"><div class="dtitle">Змінити назву</div></div>
        </div>
      </div>

      <div class="drow">
        <div class="dicon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
          </svg>
        </div>
        <div class="dbody">
          <div class="dtext"><div class="dtitle">Закрити депозит</div></div>
        </div>
      </div>

      <div class="drow">
        <div class="dicon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h13l-3-3M20 16H7l3 3"/>
          </svg>
        </div>
        <div class="dbody">
          <div class="dtext">
            <div class="dtitle">Пролонгувати</div>
            <div class="dsub">Автоматично</div>
          </div>
          <div class="toggle" id="prolong" onclick="this.classList.toggle('off')"></div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
